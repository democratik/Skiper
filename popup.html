<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        width: 250px;
        padding: 15px;
        margin: 0;
        background-color: #ffffff;
      }
      h3 {
        margin-top: 0;
        font-size: 16px;
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
      }
      .shortcut-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
        margin-top: 15px;
      }
      .toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.2s;
        border-radius: 20px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #4caf50;
      }
      input:checked + .slider:before {
        transform: translateX(16px);
      }
      button {
        width: 100%;
        padding: 8px;
        background: #e8eaed;
        color: #202124;
        border: 1px solid #dadce0;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      button:hover {
        background: #f1f3f4;
      }
      .shortcut-btn {
        width: auto;
        min-width: 100px;
        padding: 6px 10px;
        font-size: 13px;
      }
      .shortcut-btn.recording {
        background: #fff3cd;
        border-color: #ffcc00;
        color: #856404;
      }
      #status {
        color: #1a73e8;
        font-size: 12px;
        margin-top: 10px;
        text-align: center;
        min-height: 15px;
      }
    </style>
  </head>
  <body>
    <h3>Skipper Settings</h3>
    <p style="font-size: 12px; color: #666; margin: 0">
      Click the button, then press your new shortcut
    </p>

    <div class="shortcut-container">
      <label style="font-size: 14px">Skip shortcut:</label>
      <button type="button" id="shortcutRecorder" class="shortcut-btn">
        Shift + S
      </button>
    </div>
    <div id="status"></div>

    <div class="toggle-container">
      <label style="font-size: 14px">Block popups in player:</label>
      <label class="switch">
        <input type="checkbox" id="popupBlockToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
